name: Create Release

on:
 push:
   tags:
     - 'v*' # Startet, wenn du einen Tag wie v2.1.3 hochlädst

jobs:
 build:
   runs-on: ubuntu-latest
   permissions:
     contents: write # Erlaubt GitHub das Erstellen des Releases

   steps:
     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Set up JDK 21
       uses: actions/setup-java@v4
       with:
         java-version: '21'
         distribution: 'temurin'
         cache: maven

     - name: Build with Maven
       # Erstellt die JAR-Dateien im Ordner 'target'
       run: mvn clean package

     - name: Upload Release Asset
       uses: softprops/action-gh-release@v2
       with:
         # Sucht nach der großen JAR-Datei (mit Abhängigkeiten)
         # Falls Maven nur eine normale JAR baut, nimmt er diese.
         files: |
           target/*-jar-with-dependencies.jar
           target/*.jar
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
