name: Create Release

on:
 push:
   tags:
     - 'v*' # Reagiert auf v1.0, v2.1, etc.

jobs:
 build:
   runs-on: ubuntu-latest
   permissions:
     contents: write # WICHTIG: Damit GitHub das Recht hat, Dateien hochzuladen

   steps:
     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Set up JDK 21
       uses: actions/setup-java@v4
       with:
         java-version: '21' # Prüfe, ob in deiner pom.xml auch 21 steht!
         distribution: 'temurin'
         cache: maven

     - name: Build with Maven
       run: mvn clean package

     - name: Upload Release Asset
       uses: softprops/action-gh-release@v2
       with:
         files: target/*.jar # Sucht die fertige Datei im target-Ordner
